<!doctype html>
<html lang="en" data-look="sky">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Search</title>
    <!-- Fonts and KaTeX ship inside the extension (vendor/, see scripts/vendor_extension.mjs):
         extension pages may not load code from other sites. -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="app/style.css" />
    <link rel="stylesheet" href="app/looks.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="./" id="home-link"><span class="brand-dot"></span>Lecture Search</a>
        <div class="top-right">
          <span id="mode" class="mode" hidden>Demo data</span>
          <span id="health" class="health" title="Status"><i></i><span>Checking</span></span>
        </div>
      </header>

      <main>
        <section id="notice" class="notice" hidden></section>

        <!-- Home: every synced course -->
        <section id="home" hidden>
          <div class="intro">
            <h1>Your <span class="accent">courses.</span></h1>
            <p class="lede">Sync a course from Canvas with the extension, then pick it here.</p>
          </div>
          <div id="course-grid" class="course-grid"></div>
        </section>

        <!-- One course -->
        <section id="course" hidden>
          <div class="course-head">
            <div class="eyebrow" id="c-term"></div>
            <h1 id="c-code"></h1>
            <p class="course-name" id="c-name"></p>
            <ul class="facts" id="c-facts"></ul>
            <p class="coverage" id="c-note" hidden></p>
            <div class="strip-wrap">
              <div class="strip" id="c-strip" aria-hidden="true"></div>
              <p class="strip-cap" id="c-strip-cap" aria-hidden="true"></p>
            </div>
            <button type="button" class="link remove" id="c-remove" hidden>Remove from this browser</button>
          </div>

          <div class="course-body">
            <aside class="lectures">
              <div class="lectures-top">
                <div class="eyebrow" id="l-count"></div>
                <div class="chips" id="sections" role="radiogroup" aria-label="Section"></div>
              </div>
              <ol id="lecture-list" class="lecture-list"></ol>
            </aside>

            <div class="focus">
              <div id="scope" class="scope"></div>
              <form id="ask" class="ask" autocomplete="off">
                <label class="sr" for="q">Question</label>
                <textarea id="q" rows="1" maxlength="2000"></textarea>
                <button class="cta small" id="go" type="submit">
                  Ask
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
              </form>
              <p class="keys"><span><kbd>Enter</kbd> asks</span><span><kbd>Shift</kbd> <kbd>Enter</kbd> adds a line</span><span><kbd>/</kbd> jumps here</span><span><kbd>↑</kbd> <kbd>↓</kbd> move through lectures</span></p>

              <section id="result" class="result" hidden>
                <article class="answer">
                  <div class="eyebrow" id="asked"></div>
                  <div class="answer-body" id="answer"></div>
                </article>
                <div class="sources">
                  <div class="eyebrow">Sources</div>
                  <ol id="sources"></ol>
                </div>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script defer src="vendor/katex/katex.min.js"></script>
    <script type="module" src="app/app.js"></script>
  </body>
</html>
