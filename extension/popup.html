<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* The website's default look (web/src/looks.css, "sky"): two quiet colors, sky blue and white,
         and rose pink only where you act. */
      :root {
        --ground: #eaf4fd; --surface: #ffffff; --raised: #f1f8fe; --line: #cfe3f5;
        --ink: #0f2238; --muted: #5a7189; --body: #2c4259; --quiet: #5aa9e6; --panel: #bfe0fb;
        --accent: #f58bb4; --accent-hover: #f79fc1; --accent-deep: #fdeef4; --accent-line: #f4bfd4;
        --accent-ink: #b5336d; --on-accent: #3a0d22; --cta-edge: #d4648f; --bad: #d8432a;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; padding: 18px; background: var(--ground); color: var(--ink); font: 14px/1.45 "Inter Tight", system-ui, sans-serif; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 14px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
      button, a.open { display: block; width: 100%; border: 0; border-radius: 999px; padding: 11px 16px; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center; cursor: pointer; text-decoration: none; }
      #sync-all { background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 0 var(--cta-edge); transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease; }
      #sync-all:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 0 var(--cta-edge); }
      #sync-all:active { transform: translateY(3px); box-shadow: 0 0 0 var(--cta-edge); }
      #sync-all:disabled { background: var(--line); color: var(--muted); box-shadow: none; transform: none; }
      button.secondary { margin-top: 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
      button.secondary:hover { border-color: var(--quiet); background: var(--raised); }
      a.open { margin-top: 10px; background: var(--accent-deep); color: var(--accent-ink); border: 1px solid var(--accent-line); }
      a.open:hover { background: #fbdbe8; }
      #status { white-space: pre-wrap; margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--body); min-height: 2.6em; font: 12px/1.55 "JetBrains Mono", ui-monospace, monospace; }
      details { margin-top: 14px; color: var(--muted); font-size: 12px; }
      summary { cursor: pointer; }
      #ping { margin-top: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
      #out { white-space: pre-wrap; margin: 8px 0 0; font: 11px "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
      .auto { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
      .auto-text { min-width: 0; }
      .auto-title { font-weight: 600; font-size: 13px; }
      #auto-line { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .switch { position: relative; flex: none; width: 38px; height: 22px; }
      .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 0.2s; pointer-events: none; }
      .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(15, 34, 56, 0.2); transition: transform 0.2s, background 0.2s; }
      .switch input:checked + .track { background: var(--quiet); }
      .switch input:checked + .track::after { transform: translateX(16px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--quiet); outline-offset: 2px; }
      button:focus-visible, a.open:focus-visible, summary:focus-visible { outline: 2px solid var(--quiet); outline-offset: 2px; }
      .auto.paused #auto-line { color: var(--bad); }
      @media (prefers-reduced-motion: reduce) { .track, .track::after, #sync-all { transition: none; } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="dot"></span>Lecture Sync</div>
    <button id="sync-all">Sync all my classes</button>
    <button id="sync" class="secondary">Sync this Canvas course</button>
    <pre id="status">...</pre>
    <a id="open" class="open" href="#" hidden>Open course in Lecture Search ↗</a>
    <div id="auto" class="auto" hidden>
      <div class="auto-text">
        <div class="auto-title" id="auto-title">Keep updated</div>
        <div id="auto-line"></div>
      </div>
      <label class="switch"><input type="checkbox" id="auto-on" aria-labelledby="auto-title" /><span class="track"></span></label>
    </div>
    <details>
      <summary>Backend</summary>
      <button id="ping">Check backend</button>
      <pre id="out">idle</pre>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
