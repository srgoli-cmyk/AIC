services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aic
      POSTGRES_PASSWORD: aic
      POSTGRES_DB: aic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aic -d aic"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
